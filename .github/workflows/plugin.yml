name: DSH plugin verification
on:
  push:
    branches: [main, dsh-plugin]
    paths: ['dsh-plugin/**', 'tools/**', 'README.md', 'CHANGELOG.md', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['dsh-plugin/**', 'tools/**', 'README.md', 'CHANGELOG.md', '.github/workflows/plugin.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/verify.mjs
